<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHYMEVISTA</title>
 <style>
  body{
   background:white;
   margin:0;
  background:cyan;
  }
  .text{
   padding:0.6rem 4.5rem;
   margin-left:0.8rem;
  }
  #submit{
   padding:0.5rem 8rem;
   margin-left:1.5rem;
   border-radius: 2rem;
   outline:none;
   color:white;
   background : linear-gradient(to right,indigo, black);
   transition:transform ease-in-out 0.1s;
  }
  #submit:active{
   transform:scale(0.98);
   }
  
  h1{
   margin-left:20%;
   margin-top:10%;
  }
  h3,h4{
   margin-left:25%;
  }
  .e{
   font-size:12px;
   color:red;
  }
  #frontend{
   display: block;
   align-items:center;
  }
 .aside1{
  background: black;
  height:100vh;
  width:70%;
  top: 0;
  position:fixed;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  overflow-y: auto;
  padding-bottom: 2rem;
  transform: translateX(-130%);
  z-index: 200;
  transition: transform 0.3s ease-in-out;
  box-shadow:0.3rem 0.3rem 0.3rem cyan;
 }

  .aside1.open{
   transform: translateX(0);
  }
  
  #button-div{
   color:white;
   margin-top:-2rem;
   margin-left: 30%;
   font-size:4rem;
  }
  
  #log-out{
   color:red;
   margin-top:auto;
   margin-left: 10%;
   margin-bottom:3rem;
   margin-left:30%;
   flex-shrink: 0;
  }
  #log-out:active{
   transform: scale(0.95);
  }

  
  
  .aside2{
   background: black;
   width:100%;
   top:0;
   left:0;
   right:0;
   position:fixed;
   height: 6vh;
   z-index: 100;
   display:flex;
   align-self: center;
   justify-content: space-between;
   box-sizing: border-box;
  }
 .aside2 span{
   position:static;
   top:0;
   bottom:0;
   margin-left:0.6rem;
   width:auto;
   height:auto;
  font-size: 1.6rem;
  }
  .aside2 input{
   position: static;
   width:60%;
   height:70%;
   margin-left:auto;
   border-radius: 1rem;
   padding:0.3rem 0.6rem;
   border:none;
   outline: none;
   margin-top: 0.5rem;
   margin-right: 0.3rem;
  }
  #API-rhymes{
   position:static;
   width:45%;
   height:50vh;
   margin-left:25%;
  }
  #Rhyme-meaning{
   position: fixed;
   width:100%;
   height:20vh;
   margin:0 auto;
   display: flex;
   flex-direction: column;
   align-items: flex-start;
  }
  .shuffle{
   position:static;
   margin-top:auto;
   margin-left: 35%;
   margin-bottom: 0.5rem;
   border-radius:1rem;
   padding:0.5rem 1.5rem;
   outline: none;
   background:cyan;
   border:none;
   font-weight: bold;
   display: none;
  }
  .shuffle:active{
   transform:scale(0.90);
  }
  
  

  
 </style>
</head>
<body>

 <div id="frontend">
  <h1>RHYMEVISTA</h1>
    
 <br>
 <br>
 <br>
<form>
 <input class="text" id="number" type="tel" placeholder="phoneNo:">
 <div class="text-message"></div>
 <br>
 <br>
 <input class="text" id="text" type="text" placeholder="useremail">
 <div class="text-message"></div>
 <br>
 <br>
 <input class="text" id="pass" type="password" placeholder="input password">
 <div class="text-message"></div>
 <br>
 <br>
 <input id="submit" type="submit" value="sign up">
</form>
  <br>
  <a id="forget-password" href="password">forget password</a>
 <br>
 <br>
 <br>
 <br>
 <br>
 <br>
 <br>
 <br>
 <h3>your best rhyme</h3>
 </div>

 <div id="internals" style="display:none;">
<aside class="aside1">
 <h3 style="color:white; margin-top:0rem; margin-left:3rem; padding: 0.5rem;">USER PROFILE</h3>
 <br><br><br>
 <div id="button-div"> 👤 </div>
 <br><br>
 <input id="internal-phoneNO"style="padding:0.5rem 0rem; width:94%; margin-left:0.3rem"type="tel" placeholder="phoneNo">
 <br>
 <input id="internal-email"style="padding:0.5rem 0rem; width:94%; margin-left:0.3rem;  outline:none; border:none;" type="text" placeholder="email">
 <br>
 <div>
  <input id="internal-pass"style="padding-right: 20%; margin-left: 0.3rem;padding-top:0.5rem; padding-bottom:0.5rem;" type="password" placeholder="password">
 <span id="hide/show" style="color:black; margin-left:-3rem;">show</span>
 </div>
 
 <br><br>
 <div id="log-out" role="button" tabindex="0">log out</div>
</aside>

  <aside class="aside2">
   <span id="hamburger"style="color:white;">&#9776;</span>
   <input class="search" type="search" placeholder="search">
  </aside>
 
 <div id="API-rhymes"></div>
 <div id="Rhyme-meaning">
  <p class="text-paragraph"></p>
  <button class="shuffle">shuffle</button>
 </div>

 
 
 
 
 
 
 
 </div>
   
 <script src="/www.js" defer></script>
</body>
</html>
