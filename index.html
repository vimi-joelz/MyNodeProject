<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHYMEVISTA</title>
 <style>
  :root {
   --bgcyan: cyan;
   --bgtransparent: transparent;
   --gray: light-gray;
   --ppl: mediumpurple;
   --white: white;
  --click: rgba(222,222,222,0.26);
  }
  body{
   margin:0;
  background: var(--bgcyan);
  }
  .text{
   padding:0.6rem 4.5rem;
   margin-left:0.8rem;
  }
  #submit{
   padding:0.5rem 8rem;
   margin-left:1.5rem;
   border-radius: 2rem;
   outline:none;
   color:white;
   background : linear-gradient(to right,indigo, black);
   transition:transform ease-in-out 0.1s;
  }
  #submit:active{
   transform:scale(0.98);
   }
  
  h1{
   margin-left:20%;
   margin-top:10%;
  }
  h3,h4{
   margin-left:25%;
  }
  .e{
   font-size:12px;
   color:red;
  }
  #frontend{
   display: none;
   align-items:center;
  }
 .aside1{
  background: black;
  height:100vh;
  width:70%;
  top: 0;
  position:fixed;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  overflow-y: auto;
  padding-bottom: 2rem;
  transform: translateX(-130%);
  z-index: 200;
  transition: transform 0.3s ease-in-out;
  box-shadow:0.3rem 0.3rem 0.3rem cyan;
 }

  .aside1.open{
   transform: translateX(0);
  }
  
  #button-div{
   color:white;
   margin-top:-2rem;
   margin-left: 30%;
   font-size:4rem;
  }
  
  #log-out{
   color:red;
   margin-top:auto;
   margin-left: 10%;
   margin-bottom:3rem;
   margin-left:30%;
   flex-shrink: 0;
  }
  #log-out:active{
   transform: scale(0.95);
  }

  
  
  .aside2{
   background: black;
   width:100%;
   top:0;
   left:0;
   right:0;
   position:fixed;
   height: 6vh;
   z-index: 100;
   display:flex;
   align-self: center;
   justify-content: space-between;
   box-sizing: border-box;
  }
 .aside2 span{
   position:static;
   top:0;
   bottom:0;
   margin-left:0.6rem;
   width:auto;
   height:auto;
  font-size: 1.6rem;
  }
  .aside2 input{
   position: static;
   width:60%;
   height:70%;
   margin-left:auto;
   border-radius: 1rem;
   padding:0.3rem 0.6rem;
   border:none;
   outline: none;
   margin-top: 0.5rem;
   margin-right: 0.3rem;
  }
  #API-rhymes{
   position:static;
   width:45%;
   height:50vh;
   margin-left:25%;
  }
  #Rhyme-meaning{
   position: fixed;
   width:100%;
   height:20vh;
   margin:0 auto;
   display: flex;
   flex-direction: column;
   align-items: flex-start;
  }
  .shuffle{
   position:static;
   margin-top:auto;
   margin-left: 35%;
   margin-bottom: 0.5rem;
   border-radius:1rem;
   padding:0.5rem 1.5rem;
   outline: none;
   background:cyan;
   border:none;
   font-weight: bold;
   display: none;
  }
  .shuffle:active{
   transform:scale(0.90);
  }

  .cl {
   font-weight:500;
   background: var(--ppl);
   padding: 0 0.3rem;
   border-radius: 2rem;
  }
  .side-bar-icons {
   font-size:1.2rem;
   color: var(--white);
   background: var(--bgtransparent);
   border:none;
   border-color:white;
  }

  .icon-text {
   color: var(--white);
   background: var(--gray);
  }


  
  .side-bar-item {
   padding: 0.3rem 0;
   margin-left: 1rem;
  }

  .side-bar-item:active{
   background: var(--click);
   backdrop-filter: blur(0.7rem);
  }
  
 </style>
</head>
<body>

 <div id="frontend">
  <h1>RHYMEVISTA</h1>
    
 <br>
 <br>
 <br>
<form>
 <input class="text" id="number" type="tel" placeholder="phoneNo:">
 <div class="text-message"></div>
 <br>
 <br>
 <input class="text" id="text" type="text" placeholder="useremail">
 <div class="text-message"></div>
 <br>
 <br>
 <input class="text" id="pass" type="password" placeholder="input password">
 <div class="text-message"></div>
 <br>
 <br>
 <input id="submit" type="submit" value="sign up">
</form>
  <br>
  <a id="forget-password" href="password">forget password</a>
 <br>
 <br>
 <br>
 <br>
 <br>
 <br>
 <br>
 <br>
 <h3>your best rhyme</h3>
 </div>

 <div id="internals" style="display:block;">
<aside class="aside1">
 <h3 style="color:white; margin-top:0rem; margin-left:3rem; padding: 0.5rem;"><span class="cl">CL</span> &nbsp; Library</h3>
 <div class="side-bar-item" role = "button" tabindex = "0" data-action="dash-board"><span class="side-bar-icons">&#8962; </span> &nbsp; &nbsp;<span class="icon-text">Dashboard</span></div>
 <br>
 <div class="side-bar-item" role = "button" tabindex = "0" data-action="pro-file"><span class="side-bar-icons">&#128100;&#65038; </span> &nbsp; &nbsp;<span class="icon-text">Profile</span></div>
 <br>
 <div class="side-bar-item" role = "button" tabindex = "0" data-action="sett-ings"><span class="side-bar-icons">&#9881; </span> &nbsp; &nbsp; <span class="icon-text">Settings</span></div>
<br>
 <div class="side-bar-item" role = "button" tabindex = "0" data-action="likes"><span class="side-bar-icons">&#9829; </span> &nbsp; &nbsp;<span class="icon-text">Likes</span></div>
 <br>
 <div class="side-bar-item" role = "button" tabindex = "0" data-action="notification"><span class="side-bar-icons">&#128276; </span> &nbsp; &nbsp;<span class="icon-text">Notification</span></div>
<br>
 
 <br><br>
 <div id="log-out" role="button" tabindex="0">log out</div>
</aside>

  <aside class="aside2">
   <span id="hamburger"style="color:white;">&#9776;</span>
   <input class="search" type="search" placeholder="search">
  </aside>
 
 <div id="API-rhymes"></div>
 <div id="Rhyme-meaning">
  <p class="text-paragraph"></p>
  <button class="shuffle">shuffle</button>
 </div>

 
 
 
 
 
 
 
 </div>
   
 <script src="/www.js" defer></script>
</body>
</html>
